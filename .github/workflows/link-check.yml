# Doc hygiene: fail if an internal Markdown link points at a file that doesn't
# exist. The docs (CLAUDE.md, context/, planning/) are heavily cross-linked, and
# a rename silently breaks them. Ignores links inside inline-code and HTML
# comments, so documented link *syntax* examples don't trip it.
name: link-check

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check internal Markdown links
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = 0
          for f in sorted(glob.glob('**/*.md', recursive=True)):
              if f.startswith(('build/', 'build-')):   # local build trees
                  continue
              text = open(f, encoding='utf-8').read()
              text = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL)  # drop HTML comments
              text = re.sub(r'`[^`]*`', '', text)                      # drop inline code
              base = os.path.dirname(f)
              for m in re.findall(r'\]\(([^)]+)\)', text):
                  t = m.split('#')[0].strip()
                  if not t or t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  # bundle-relative absolute links ("/st0601.md") resolve from context/
                  p = (os.path.join('context', t.lstrip('/')) if t.startswith('/')
                       else os.path.normpath(os.path.join(base, t)))
                  if not os.path.exists(p):
                      print(f'BROKEN  {f}  ->  {m}'); bad += 1
          print('all internal links resolve' if not bad else f'{bad} broken link(s)')
          sys.exit(1 if bad else 0)
          PY
