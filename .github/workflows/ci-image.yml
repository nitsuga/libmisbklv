# SPDX-License-Identifier: Apache-2.0
name: CI image

# Never runs on pull_request: this job has packages: write and runs on a
# persistent host, so it must not be reachable from fork-supplied code.
# Publishing is a trusted-push (or manual) operation only.
on:
  push:
    branches: [main]
    paths:
      - ci/Dockerfile
      - .github/workflows/ci-image.yml
  workflow_dispatch:

jobs:
  build:
    # No container: here on purpose -- this job needs the host Docker daemon.
    runs-on: [self-hosted, libmisbklv]
    timeout-minutes: 30
    permissions:
      # contents:read is needed too -- naming any scope zeroes the rest.
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nitsuga/libmisbklv-ci
      CI_CAPACITY_DIR: /home/eric/ci-cache
    steps:
      - uses: actions/checkout@v5
      - name: Scope registry credentials to this job
        # The default docker config lives in the runner user's home, which
        # every other job on this host can read. RUNNER_TEMP is per-job.
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        # The commit tag is what CI consumes -- immutable, so a queued run can
        # never pick up a different image than the one it was queued against.
        # :latest is a convenience pointer, not something CI resolves.
        # Layers already on this host are reused, so an unchanged apt list
        # makes this a no-op rebuild.
        run: |
          bash ci/with-capacity.sh 2 bash -c '
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
            -f ci/Dockerfile ci
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          '
      - name: Remove credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
