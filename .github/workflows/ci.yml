# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true  # materialize data/*.ts for the regression tests
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "$PWD/_install"
      - name: Consumer smoke test (find_package, core + gst component)
        # Builds a throwaway out-of-tree project against the install — catches
        # export/packaging gaps that a bare `cmake --install` cannot.
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(misbklv REQUIRED COMPONENTS gst)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE misbklv::gst)  # transitively: core
          EOF
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include "misbklv/stream.hpp"
          #include "misbklv/message.hpp"
          int main() { return 0; }  // link-only: proves both components resolve
          EOF
          cmake -S /tmp/consumer -B /tmp/consumer/build -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build /tmp/consumer/build

  sanitizers:
    # Real-world hardening: the core parse/codec paths must be free of UB / OOB
    # on adversarial input. gstreamer is off so ASan isn't noised by gst internals.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true  # data/*.ts for the extraction/stream tests
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Configure (ASan + UBSan, no gstreamer)
        run: cmake -S . -B build-san -DMISBKLV_SANITIZE=ON -DMISBKLV_GSTREAMER=OFF
      - name: Build
        run: cmake --build build-san
      - name: Test under sanitizers
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1

  registry-drift:
    # ADR 0012: the committed constexpr tables must match a fresh regeneration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate registry tables
        run: |
          for r in uas0601 vmti0903 vtarget0903; do
            python3 tools/gen_registry.py \
              "registry/$r.toml" "include/misbklv/registry/${r}_tables.generated.hpp"
          done
      - name: Fail on drift
        run: git diff --exit-code -- include/misbklv/registry
