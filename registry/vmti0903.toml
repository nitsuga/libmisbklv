# ST 0903.6 VMTI Local Set — descriptor source of truth (ADR 0012).
# Used standalone or nested under ST 0601 Item 74 (see registry/uas0601.toml).
# M3 subset: scalar items exercised by the nesting fixture. The VTarget Series
# (Item 101), IMAPB FoV items (11/12), and MIIS ID (13) are follow-on work.

registry     = "VMTI_0903"
tag_encoding = "ber_oid"
ul_key       = "060e2b34020b01010e01030306000000"

[[item]]
tag    = 1
name   = "Checksum"
kind   = "uint"
length = 2

[[item]]
tag    = 2
name   = "Precision Time Stamp"
units  = "microseconds"
kind   = "uint"
length = 8

[[item]]                       # §10.1.4 — variable-length uint (V2), values 1..65535
tag      = 4
name     = "VMTI LS Version Number"
kind     = "uint"
length   = 2
variable = true

[[item]]                       # §10.1.5 — variable-length uint (V3), values 0..0xFFFFFF
tag      = 5
name     = "Total Number of Targets Detected"
kind     = "uint"
length   = 3
variable = true

[[item]]                       # §10.1.6 — variable-length uint (V3), values 0..0xFFFFFF
tag      = 6
name     = "Number of Reported Targets"
kind     = "uint"
length   = 3
variable = true

[[item]]                       # §10.1.11 — IMAPB(0,180); e.g. 12.5° -> 0x0640
tag    = 11
name   = "VMTI Horizontal Field of View"
units  = "deg"
kind   = "imapb"
length = 2
min    = 0.0
max    = 180.0

[[item]]                       # §10.1.12 — IMAPB(0,180)
tag    = 12
name   = "VMTI Vertical Field of View"
units  = "deg"
kind   = "imapb"
length = 2
min    = 0.0
max    = 180.0

[[item]]                       # §10.1.101 — Series of VTarget Packs (Item 101)
tag   = 101
name  = "vTargetSeries"
kind  = "pack"
child = "vtarget_0903"
