# ST 0601.19 UAS Datalink Local Set — descriptor source of truth (ADR 0012).
# Regenerate the constexpr tables with:  tools/gen_registry.py (or the
# `regenerate-registry` CMake target). Generated output is committed at
# include/misbklv/registry/uas0601_tables.generated.hpp — do not hand-edit it.
#
# Coverage: the full ST 0601.19 item set (§8.1–8.143), less Item 66 (deprecated
# by the standard, no format defined — it stays unregistered and round-trips
# raw). Every entry is transcribed from that item's §8.N format block: the
# software Min/Max become `min`/`max`, the KLV column decides `kind` + `signed`,
# and the "Special Values" row becomes `[[item.special]]`.
#
# Conventions:
#   * `linear_lds` — the ST 0601 linear mapping. Signed items are symmetric
#     (min == -max, which `linear_decode` relies on); unsigned ones carry the
#     offset in `min` (e.g. altitudes map uint16 onto -900..19000).
#   * `imapb` — ST 1201 IMAPB. These items are variable-length in the standard:
#     `length` is the DEFAULT ENCODE WIDTH (chosen from the item's documented
#     per-width resolution), `variable = true` records that the standard lets a
#     sender pick another. Decoding always honours the actual field length.
#   * `bytes` — structurally opaque: another standard's Local Set (0102, 0806,
#     1002, 1206, 1601, 1602, 1607, 1010) or a DLP/FLP/VLP pack 0601 defines
#     item-locally. Registered for the NAME and typed raw access; the value
#     round-trips byte-for-byte exactly as an unregistered item would.

registry     = "UAS_0601"
tag_encoding = "ber_oid"
ul_key       = "060e2b34020b01010e01030101000000"

